[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Astro fingerprints everything in /_astro/, so it can be cached forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Guide PDFs are replaced from the admin panel, keep cache short
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Until the main website ships (Milestone 2), the bare domain opens the first-time buyer guide.
# 302 (temporary) so browsers and search engines don't cache it. Remove both rules when the homepage launches.
[[redirects]]
  from = "/"
  to = "/first-time-homebuyer-guide/"
  status = 302
  force = true

[[redirects]]
  from = "/styleguide/*"
  to = "/first-time-homebuyer-guide/"
  status = 302
  force = true
